<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SED Motors — Admin Portal</title>
  <meta name="description" content="SED Motors Admin Portal — Secure Login & Registration">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1628;
      --navy2: #0f2040;
      --navy3: #162d50;
      --amber: #f59e0b;
      --amber2: #d97706;
      --amber3: #fbbf24;
      --white: #ffffff;
      --card-bg: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.12);
      --input-bg: rgba(255,255,255,0.08);
      --input-border: rgba(255,255,255,0.15);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --r: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ── Animated mesh background ── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(245,158,11,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(14,165,233,0.07) 0%, transparent 70%),
        linear-gradient(135deg, #0a1628 0%, #0f2040 40%, #162d50 100%);
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(60px);
      animation: orbFloat linear infinite; z-index: 0; pointer-events: none;
    }
    .orb-1 { width:420px;height:420px;background:rgba(245,158,11,0.12);top:-80px;right:-80px;animation-duration:18s; }
    .orb-2 { width:320px;height:320px;background:rgba(99,102,241,0.10);bottom:-60px;left:-60px;animation-duration:22s;animation-delay:-8s; }
    .orb-3 { width:240px;height:240px;background:rgba(16,185,129,0.08);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:30s;animation-delay:-14s; }

    @keyframes orbFloat {
      0%,100% { transform: translateY(0) scale(1); }
      33%      { transform: translateY(-30px) scale(1.05); }
      66%      { transform: translateY(20px) scale(0.97); }
    }

    /* ── Grid pattern overlay ── */
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Wrap ── */
    .portal-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 480px; padding: 24px;
      animation: wrapIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes wrapIn {
      from { opacity:0; transform: translateY(30px); }
      to   { opacity:1; transform: translateY(0); }
    }

    /* ── Logo ── */
    .portal-logo {
      text-align: center; margin-bottom: 36px;
      animation: logoIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.1s both;
    }
    @keyframes logoIn {
      from { opacity:0; transform: translateY(-20px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .logo-icon-wrap {
      display: inline-flex; align-items: center; justify-content: center;
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, var(--amber), var(--amber2));
      box-shadow: 0 8px 32px rgba(245,158,11,0.4), 0 0 0 1px rgba(245,158,11,0.2);
      margin-bottom: 18px;
      animation: iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%,100% { box-shadow: 0 8px 32px rgba(245,158,11,0.4), 0 0 0 1px rgba(245,158,11,0.2); }
      50%      { box-shadow: 0 8px 48px rgba(245,158,11,0.6), 0 0 0 6px rgba(245,158,11,0.08); }
    }
    .logo-icon-wrap svg { width: 36px; height: 36px; color: #0a1628; }

    .portal-logo h1 {
      font-size: 28px; font-weight: 900; color: var(--white);
      letter-spacing: -0.5px; line-height: 1.1;
    }
    .portal-logo h1 .highlight { color: var(--amber); }
    .portal-logo .tagline {
      font-size: 12px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); margin-top: 6px;
    }

    /* ── Card ── */
    .portal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(20px) scale(0.98); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    /* ── Tab row ── */
    .tab-row {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px;
      margin-bottom: 32px; position: relative;
    }
    .tab-slider {
      position: absolute; top: 4px; bottom: 4px;
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 8px;
      transition: left 0.3s cubic-bezier(0.34,1.56,0.64,1), width 0.3s ease;
      z-index: 0;
    }
    .tab-btn {
      flex: 1; padding: 11px 16px;
      background: none; border: none;
      color: var(--muted); font-family: inherit;
      font-size: 13.5px; font-weight: 600;
      cursor: pointer; border-radius: 8px;
      transition: color 0.2s; position: relative; z-index: 1;
    }
    .tab-btn.active { color: var(--amber3); }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; animation: viewIn 0.35s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes viewIn {
      from { opacity:0; transform: translateX(10px); }
      to   { opacity:1; transform: translateX(0); }
    }

    /* ── Form group ── */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 11.5px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted); pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px; color: var(--white);
      font-family: inherit; font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-group input:focus {
      border-color: var(--amber);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }
    .form-group input::placeholder { color: rgba(148,163,184,0.5); }

    .pw-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 4px; line-height: 0; transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--white); }
    .pw-toggle svg { width: 17px; height: 17px; }

    /* ── Submit btn ── */
    .btn-submit {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber2) 100%);
      border: none; border-radius: 12px;
      color: #0a1628; font-family: inherit; font-size: 14.5px; font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(245,158,11,0.35);
      letter-spacing: 0.3px;
      margin-top: 8px; position: relative; overflow: hidden;
    }
    .btn-submit::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245,158,11,0.45); }
    .btn-submit:hover::before { opacity: 1; }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Alert ── */
    .alert {
      padding: 13px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; margin-bottom: 20px;
      display: none; align-items: center; gap: 10px;
    }
    .alert.error {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5; display: flex;
    }
    .alert.success {
      background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.25);
      color: #6ee7b7; display: flex;
    }
    .alert svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--muted); font-size: 12px; font-weight: 600;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1);
    }

    /* ── Footer ── */
    .back-link {
      text-align: center; margin-top: 24px;
      font-size: 13px; color: var(--muted);
      animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.35s both;
    }
    .back-link a { color: var(--amber); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .back-link a:hover { color: var(--amber3); text-decoration: underline; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(10,22,40,0.3); border-top-color: #0a1628;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }

    /* ── Floating particles ── */
    .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .particle {
      position: absolute; width: 2px; height: 2px;
      background: rgba(245,158,11,0.5); border-radius: 50%;
      animation: particleFly linear infinite;
    }
    @keyframes particleFly {
      0%   { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-100px) translateX(var(--drift,20px)) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <div class="portal-wrap">
    <div class="portal-logo">
      <div class="logo-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
          <path d="M5 17H3v-4l2-5h9l4 5h1a2 2 0 0 1 2 2v2h-2"/>
          <path d="M9 17h6"/>
        </svg>
      </div>
      <h1>SED <span class="highlight">Motors</span></h1>
      <div class="tagline">Admin Portal</div>
    </div>

    <div class="portal-card">
      <div class="tab-row" id="tabRow">
        <div class="tab-slider" id="tabSlider"></div>
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register Admin</button>
      </div>

      <!-- ── LOGIN ── -->
      <div class="view active" id="loginView">
        <div class="alert" id="loginAlert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="loginAlertText"></span>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Admin Email</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="loginEmail" placeholder="you@sedmotors.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="loginBtn">Sign In to Dashboard</button>
        </form>
      </div>

      <!-- ── REGISTER ── -->
      <div class="view" id="registerView">
        <div class="alert" id="registerAlert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="registerAlertText"></span>
        </div>
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="regName" placeholder="e.g. Sasmitha Thejan" required>
            </div>
          </div>
          <div class="form-group">
            <label>Admin Email</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="regEmail" placeholder="you@sedmotors.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="regPassword" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
              <button type="button" class="pw-toggle" onclick="togglePw('regPassword', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="registerBtn">Create Admin Account</button>
        </form>
      </div>
    </div>

    <div class="back-link">
      <a href="/index.html">← Back to Customer Site</a>
    </div>
  </div>

  <script>
    /* ── Particles ── */
    const pc = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.cssText = `left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${-Math.random()*20}s;--drift:${(Math.random()-0.5)*120}px;opacity:${0.3+Math.random()*0.5}`;
      pc.appendChild(p);
    }

    /* ── Tab slider position ── */
    function updateSlider(active) {
      const row = document.getElementById('tabRow');
      const btn = document.getElementById(active === 'login' ? 'loginTab' : 'registerTab');
      const slider = document.getElementById('tabSlider');
      slider.style.left = btn.offsetLeft + 'px';
      slider.style.width = btn.offsetWidth + 'px';
    }

    /* ── Switch tab ── */
    function switchTab(tab) {
      document.getElementById('loginTab').classList.toggle('active', tab === 'login');
      document.getElementById('registerTab').classList.toggle('active', tab === 'register');
      document.getElementById('loginView').classList.toggle('active', tab === 'login');
      document.getElementById('registerView').classList.toggle('active', tab === 'register');
      updateSlider(tab);
    }

    window.addEventListener('load', () => updateSlider('login'));

    /* ── Toggle password visibility ── */
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.innerHTML = isText
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    }

    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      const textEl = document.getElementById(id + 'Text');
      if (textEl) textEl.textContent = msg;
      else el.textContent = msg;
      el.className = 'alert ' + type;
    }

    function hideAlert(id) {
      document.getElementById(id).className = 'alert';
      document.getElementById(id).style.display = '';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Please wait…';
      } else {
        btn.disabled = false;
        btn.innerHTML = btnId === 'loginBtn' ? 'Sign In to Dashboard' : 'Create Admin Account';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert('loginAlert');
      setLoading('loginBtn', true);
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const formData = new URLSearchParams();
      formData.append('username', email);
      formData.append('password', password);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });
        if (res.ok) {
          const meRes = await fetch('/api/auth/me');
          if (meRes.ok) {
            const user = await meRes.json();
            if (user.role === 'ROLE_ADMIN') {
              window.location.href = '/admin.html';
            } else {
              showAlert('loginAlert', 'Access denied. This account does not have Admin privileges.', 'error');
              await fetch('/api/auth/logout', { method: 'POST' });
            }
          }
        } else {
          showAlert('loginAlert', 'Invalid email or password. Please try again.', 'error');
        }
      } catch (err) {
        showAlert('loginAlert', 'Could not connect to server. Ensure the application is running.', 'error');
      } finally {
        setLoading('loginBtn', false);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert('registerAlert');
      setLoading('registerBtn', true);
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      try {
        const res = await fetch('/api/auth/register-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        if (res.ok) {
          showAlert('registerAlert', '✅ Admin account created! You can now sign in.', 'success');
          document.getElementById('registerForm').reset();
          setTimeout(() => {
            document.getElementById('loginEmail').value = email;
            switchTab('login');
          }, 1500);
        } else {
          const errText = await res.text();
          showAlert('registerAlert', errText || 'Registration failed. Email may already be in use.', 'error');
        }
      } catch (err) {
        showAlert('registerAlert', 'Could not connect to server. Ensure the application is running.', 'error');
      } finally {
        setLoading('registerBtn', false);
      }
    }

    // If already logged in as admin, redirect straight to dashboard
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const user = await res.json();
          if (user.role === 'ROLE_ADMIN') {
            window.location.href = '/admin.html';
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
