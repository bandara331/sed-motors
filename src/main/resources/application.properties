spring.application.name=sed-motors

# ─── Database ─────────────────────────────────────────────────────────────────
# Locally: uses localhost MySQL. On Render: set SPRING_DATASOURCE_URL etc as env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sed_motors_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Server Port ──────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Gmail SMTP Config ────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:suwanimanohari2005@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:95353097Su}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

